# docker-compose.snippet.yml — blocks to add to your docker-compose.override.yml
#
# This is NOT a full compose file. Copy the blocks below into your existing
# LibreChat `docker-compose.override.yml` under the corresponding top-level keys
# (`services:` and `networks:`).
#
# It assumes the Docker image is already available (pull from GHCR, or build it
# yourself). Replace <YOUR-DOMAIN> with your public hostname.

services:
  # ------------------------------------------------------------
  # Nginx additional volume (read-only) for X-Accel-Redirect
  # ------------------------------------------------------------
  nginx:
    volumes:
      # keep your existing nginx volumes and add this line:
      - ./data/private:/data/private:ro

  # ------------------------------------------------------------
  # Personal Files MCP server
  # ------------------------------------------------------------
  librechat-personal-files:
    image: ghcr.io/martinriesel/librechat-personal-files-mcp:latest
    container_name: librechat-personal-files
    restart: unless-stopped
    user: "2000:2500"
    environment:
      USER_HEADER: X-User-Id
      # Local provider remains the default. Add `onedrive` only after completing
      # docs/onedrive-configuration.md and populating the required secrets.
      STORAGE_PROVIDERS: ${STORAGE_PROVIDERS:-local}
      STORAGE_ROOT: /data/private
      SHARE_ROOT: /data/share
      RAG_API_URL: http://rag_api:8000
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: https://<YOUR-DOMAIN>/files
      MAX_FILE_SIZE_MB: "20"
      REGISTRY_DB: /data/private/_system/links.db
      UMASK: "002"
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_SCOPES: ${AZURE_SCOPES:-Files.ReadWrite.AppFolder User.Read offline_access}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI:-}
      ONEDRIVE_TOKEN_ENCRYPTION_KEY: ${ONEDRIVE_TOKEN_ENCRYPTION_KEY:-}
      ONEDRIVE_MAX_FILE_SIZE_MB: ${ONEDRIVE_MAX_FILE_SIZE_MB:-100}
      ONEDRIVE_VIEWER_BASE_URL: ${ONEDRIVE_VIEWER_BASE_URL:-}
    volumes:
      - ./data/private:/data/private
      - ./data/share:/data/share
    networks:
      - default
      - librechat-internal

networks:
  default:
    driver: bridge

  shared-proxy:
    external: true

  librechat-internal:
    driver: bridge
