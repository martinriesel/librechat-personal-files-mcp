# docker-compose.snippet.yml — blocks to add to docker-compose.override.yml
#
# Copy these blocks into your existing docker-compose.override.yml under the
# corresponding top-level keys (services:, networks:).
#
# See also HOST_SETUP.sh for one-time host preparation commands.

services:
  # ------------------------------------------------------------
  # Nginx additional volume (read-only) for X-Accel-Redirect
  # ------------------------------------------------------------
  nginx:
    volumes:
      # existing volumes must be kept; add this line:
      - ./data/private:/data/private:ro

  # ------------------------------------------------------------
  # Personal Files MCP server
  # ------------------------------------------------------------
  librechat-personal-files:
    build:
      context: ./mcp-personal-files
    # After publishing to GHCR, replace 'build' with:
    # image: ghcr.io/martinriesel/librechat-personal-files-mcp:latest
    container_name: librechat-personal-files
    restart: unless-stopped
    user: "2000:2500"
    environment:
      USER_HEADER: X-User-Id
      STORAGE_ROOT: /data/private
      SHARE_ROOT: /data/share
      RAG_API_URL: http://rag_api:8000
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: https://gpt.riesel.com.br/files
      MAX_FILE_SIZE_MB: "20"
      REGISTRY_DB: /data/private/_system/links.db
      UMASK: "002"
    volumes:
      - ./data/private:/data/private
      - ./data/share:/data/share
    networks:
      - default
      - librechat-internal

networks:
  default:
    driver: bridge

  shared-proxy:
    external: true

  librechat-internal:
    driver: bridge