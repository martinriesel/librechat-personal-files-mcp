# docker-compose.snippet.yml — service block for librechat-personal-files-mcp
#
# This is NOT a full compose file. Copy the blocks below into your LibreChat
# `docker-compose.override.yml` (or a Dokploy Compose application) under the
# corresponding top-level keys (`services:`, `volumes:`, `networks:`).
#
# Replace the placeholders:
#   <tag>              an existing image tag, see
#                      https://github.com/martinriesel/librechat-personal-files-mcp/pkgs/container/librechat-personal-files-mcp
#                      (CI publishes `v*` git tags without the `v`, e.g. 1.5.0-test;
#                      `latest` follows `main` and may lag behind tagged versions)
#   <YOUR-DOMAIN>      public hostname that routes /files/ to this container
#   <shared-network>   an existing Docker network that also contains rag_api and
#                      MongoDB (and your reverse proxy), so their hostnames resolve
#
# Secrets (JWT_SECRET, SERVICE_TOKEN, LIBRECHAT_MONGO_URI) are read from the
# environment / .env file. Never write real values here.

services:
  librechat-personal-files:
    image: ghcr.io/martinriesel/librechat-personal-files-mcp:<tag>
    # No fixed container_name: it conflicts with other instances and prevents
    # managed rolling updates (Dokploy). Reach the service by its service name.
    restart: unless-stopped
    user: "2000:2500"
    environment:
      # Identity / context headers sent by LibreChat
      USER_HEADER: X-User-Id
      CONVERSATION_HEADER: X-Conversation-Id
      # Storage
      STORAGE_ROOT: /data/private
      SHARE_ROOT: /data/share
      REGISTRY_DB: /data/private/_system/links.db
      MAX_FILE_SIZE_MB: "20"
      MAX_BINARY_FILE_MB: "50"
      UMASK: "002"
      # Public links (served directly by this container, no Nginx required)
      PUBLIC_BASE_URL: https://<YOUR-DOMAIN>/files
      # RAG (same JWT_SECRET as LibreChat and rag_api, >= 32 chars)
      RAG_API_URL: http://rag_api:8000
      JWT_SECRET: ${JWT_SECRET}
      # Service-to-service uploads (POST /binary); empty disables the endpoint
      SERVICE_TOKEN: ${PERSONAL_FILES_SERVICE_TOKEN:-}
      # Project resolution (read-only MongoDB user; see docs/mongodb-permissions-dokploy.md)
      LIBRECHAT_MONGO_URI: ${LIBRECHAT_MONGO_URI:-}
      LIBRECHAT_MONGO_DB: ${LIBRECHAT_MONGO_DB:-LibreChat}
      LIBRECHAT_MONGO_TIMEOUT_MS: ${LIBRECHAT_MONGO_TIMEOUT_MS:-2000}
      # Logging / diagnostics (turn diagnostics off after validation)
      PERSONAL_FILES_LOG_LEVEL: ${PERSONAL_FILES_LOG_LEVEL:-INFO}
      PERSONAL_FILES_CONTEXT_DIAGNOSTICS: ${PERSONAL_FILES_CONTEXT_DIAGNOSTICS:-false}
    volumes:
      # Persistent user data. Use named volumes (or existing external volumes);
      # never point these at empty directories during an upgrade.
      - personal_files_private:/data/private
      - personal_files_share:/data/share
    networks:
      - default
      - shared

volumes:
  personal_files_private:
  personal_files_share:
  # To reuse volumes created by another compose project, declare them as:
  #   personal_files_private:
  #     external: true
  #     name: <existing-volume-name>

networks:
  shared:
    external: true
    name: <shared-network>
