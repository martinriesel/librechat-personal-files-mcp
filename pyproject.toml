[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "librechat-personal-files-mcp"
version = "1.0.0"
description = "MCP server providing per-user personal file storage, documentation, RAG and public publishing for LibreChat agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "riesel" }]
dependencies = [
    "fastmcp>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "filelock>=3.15.0",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[project.scripts]
personal-files-mcp = "personal_files_mcp.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_files_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
